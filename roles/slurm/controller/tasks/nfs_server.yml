---

- name: Create nfs dir
  ansible.builtin.file:
    path: /srv/nfs4
    owner: root
    group: root
    mode: "0755"
    state: directory

- name: Ensure firewalld is running
  ansible.builtin.systemd_service:
    name: firewalld
    state: started
    enabled: true

- name: Open ports for nfs-server
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    state: enabled
    immediate: true
  loop:
    - nfs
    - rpc-bind
    - mountd

- name: Start and enable nfs-server
  ansible.builtin.systemd_service:
    name: nfs-server
    state: started
    enabled: true

- name: Update /etc/exports
  ansible.builtin.template:
    src: exports
    dest: /etc/exports
    owner: root
    group: root
    mode: "0644"

- name: Export NFS share
  ansible.builtin.command: exportfs -ra
  changed_when: false
