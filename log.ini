[loggers]
keys=root,keystoneauth

[handlers]
keys=fileHandler,consoleHandler

[formatters]
keys=fileFormatter

[logger_root]
level=DEBUG
handlers=fileHandler,consoleHandler

[logger_keystoneauth]
level=ERROR
handlers=fileHandler,consoleHandler
propagate=0
qualname=keystoneauth

[handler_fileHandler]
class=handlers.RotatingFileHandler
level=INFO
formatter=fileFormatter
args=('/var/log/slurmstack/slurmstack.log','a',100*1024*1024,10)

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=fileFormatter
args=(sys.stderr,)

[formatter_fileFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s